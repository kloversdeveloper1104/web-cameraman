<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>
body {
  margin: 0;
  background: #111;
  font-family: sans-serif;
  color: #fff;
}

/* ===== ギャラリー ===== */
.gallery {
  display: grid;
  gap: 6px;
  padding: 6px;
}

/* スマホ */
.gallery {
  grid-template-columns: repeat(2, 1fr);
}

.gallery figure {
  margin: 0;
  position: relative;
  cursor: pointer;
}

.gallery img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  display: block;
  border-radius: 8px;
  background: #1a1a1a;
}

.gallery figcaption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 4px 8px;
  font-size: 11px;
  color: #fff;
  background: linear-gradient(transparent, rgba(0,0,0,0.75));
  border-radius: 0 0 8px 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* タブレット */
@media (min-width: 600px) {
  .gallery {
    grid-template-columns: repeat(3, 1fr);
  }
  .gallery img {
    height: 180px;
  }
}

/* PC */
@media (min-width: 1024px) {
  .gallery {
    grid-template-columns: repeat(5, 1fr);
    max-width: 1200px;
    margin: auto;
    gap: 10px;
  }
  .gallery img {
    height: 220px;
    border-radius: 10px;
  }
}

/* 大画面 */
@media (min-width: 1400px) {
  .gallery {
    grid-template-columns: repeat(6, 1fr);
    max-width: 1400px;
  }
}

/* ===== モーダル ===== */
#modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  overflow: hidden;
  touch-action: none;
}

#modalImgWrap {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

#modal img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  touch-action: none;
  will-change: transform;
  user-select: none;
  -webkit-user-drag: none;
}

/* ×ボタン */
#closeBtn {
  position: absolute;
  top: 20px;
  right: 24px;
  font-size: 32px;
  color: white;
  cursor: pointer;
  padding: 10px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  z-index: 2;
}

/* テキスト */
#caption {
  position: absolute;
  bottom: 20px;
  right: 20px;
  font-size: 14px;
  background: rgba(0,0,0,0.6);
  padding: 10px 14px;
  border-radius: 10px;
  max-width: 70%;
}
</style>
</head>

<body>

<div class="gallery" id="gallery"></div>

<div id="modal">
  <span id="closeBtn">&times;</span>
  <div id="modalImgWrap">
    <img id="modalImg">
  </div>
  <div id="caption"></div>
</div>

<script>
const gallery = document.getElementById("gallery");
const modal = document.getElementById("modal");
const modalImgWrap = document.getElementById("modalImgWrap");
const modalImg = document.getElementById("modalImg");
const caption = document.getElementById("caption");
const closeBtn = document.getElementById("closeBtn");

let allImages = [];
let currentIndex = 0;

function thumbSrc(src) {
  const file = src.split("/").pop();
  const base = file.replace(/\.[^.]+$/, "");
  return "co/thumbs/" + base + ".webp";
}

function renderGallery() {
  gallery.innerHTML = "";

  allImages.forEach((item, index) => {
    const figure = document.createElement("figure");

    const img = document.createElement("img");
    img.src = thumbSrc(item.src);
    img.loading = "lazy";
    img.alt = item.text || "";
    figure.appendChild(img);

    if (item.text) {
      const cap = document.createElement("figcaption");
      cap.textContent = item.text;
      figure.appendChild(cap);
    }

    figure.onclick = () => {
      modal.style.display = "flex";
      showImage(index);
      document.body.style.overflow = "hidden";
    };

    gallery.appendChild(figure);
  });
}

// 表示
function showImage(index) {
  currentIndex = index;
  resetZoom();
  modalImg.src = allImages[index].src;
  caption.textContent = allImages[index].text;
}

// 閉じる
function closeModal() {
  modal.style.display = "none";
  document.body.style.overflow = "";
  resetZoom();
}

closeBtn.onclick = closeModal;

modal.onclick = (e) => {
  if (e.target === modal) closeModal();
};

// ESC
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

// ===== ズーム・パン・スワイプ =====
let scale = 1;
let panX = 0;
let panY = 0;

function applyTransform() {
  modalImg.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}

function resetZoom() {
  scale = 1;
  panX = 0;
  panY = 0;
  applyTransform();
}

function clampPan() {
  const rect = modalImg.getBoundingClientRect();
  const wrapRect = modalImgWrap.getBoundingClientRect();
  const overX = Math.max(0, (rect.width - wrapRect.width) / 2);
  const overY = Math.max(0, (rect.height - wrapRect.height) / 2);
  panX = Math.min(overX, Math.max(-overX, panX));
  panY = Math.min(overY, Math.max(-overY, panY));
}

const pointers = new Map();
let pinchStartDist = 0;
let pinchStartScale = 1;
let dragStart = null; // { x, y, panX, panY }
let swipeStartX = null;
let didPinchOrDrag = false;

function dist(p1, p2) {
  return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

modalImgWrap.addEventListener("pointerdown", (e) => {
  modalImgWrap.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  didPinchOrDrag = false;

  if (pointers.size === 1) {
    if (scale > 1) {
      dragStart = { x: e.clientX, y: e.clientY, panX, panY };
    } else {
      swipeStartX = e.clientX;
    }
  } else if (pointers.size === 2) {
    const [p1, p2] = [...pointers.values()];
    pinchStartDist = dist(p1, p2);
    pinchStartScale = scale;
    dragStart = null;
    swipeStartX = null;
  }
});

modalImgWrap.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 2) {
    didPinchOrDrag = true;
    const [p1, p2] = [...pointers.values()];
    const d = dist(p1, p2);
    if (pinchStartDist > 0) {
      scale = Math.min(4, Math.max(1, pinchStartScale * (d / pinchStartDist)));
      clampPan();
      applyTransform();
    }
  } else if (pointers.size === 1 && dragStart) {
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didPinchOrDrag = true;
    panX = dragStart.panX + dx;
    panY = dragStart.panY + dy;
    clampPan();
    applyTransform();
  }
});

function endPointer(e) {
  const wasSwipe = pointers.size === 1 && swipeStartX !== null && scale <= 1 && !didPinchOrDrag;
  let swipeDx = 0;
  if (wasSwipe) swipeDx = e.clientX - swipeStartX;

  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    dragStart = null;
    swipeStartX = null;
    pinchStartDist = 0;
    if (scale < 1) resetZoom();
  }

  if (wasSwipe) {
    if (swipeDx > 50) {
      currentIndex = (currentIndex - 1 + allImages.length) % allImages.length;
      showImage(currentIndex);
    } else if (swipeDx < -50) {
      currentIndex = (currentIndex + 1) % allImages.length;
      showImage(currentIndex);
    } else if (!didPinchOrDrag) {
      // タップ: 左右クリックでページ送り(PC/スマホ共通)
      const rect = modalImgWrap.getBoundingClientRect();
      if (e.clientX - rect.left < rect.width / 2) {
        currentIndex = (currentIndex - 1 + allImages.length) % allImages.length;
      } else {
        currentIndex = (currentIndex + 1) % allImages.length;
      }
      showImage(currentIndex);
    }
  }
}

modalImgWrap.addEventListener("pointerup", endPointer);
modalImgWrap.addEventListener("pointercancel", endPointer);

// ダブルタップ/ダブルクリックでズーム切り替え
let lastTapTime = 0;
modalImgWrap.addEventListener("pointerup", (e) => {
  const now = Date.now();
  if (now - lastTapTime < 300 && pointers.size === 0) {
    scale = scale > 1 ? 1 : 2;
    panX = 0;
    panY = 0;
    applyTransform();
  }
  lastTapTime = now;
});

// トラックパッド/マウスホイールでズーム(Ctrl+ホイールはブラウザのピンチ相当)
modalImgWrap.addEventListener(
  "wheel",
  (e) => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    scale = Math.min(4, Math.max(1, scale - e.deltaY * 0.01));
    clampPan();
    applyTransform();
    if (scale <= 1) resetZoom();
  },
  { passive: false }
);

// ===== 読み込み =====
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

async function init() {
  const res = await fetch("data/images.json");
  allImages = shuffle(await res.json());
  renderGallery();
}

init();
</script>

</body>
</html>
